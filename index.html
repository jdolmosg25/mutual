<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutual Media Group — Audiovisual y Fotografía</title>
  <meta name="description" content="Audiovisual y fotografía. Bogotá." />

  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=montserrat:400,500,700,800&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/png" href="favicon.png" />

  <style>
    :root {
      --bg:       #000000;
      --white:    #ffffff;
      --font:     'Montserrat', sans-serif;
      --w60:      rgba(255,255,255,0.60);
      --w40:      rgba(255,255,255,0.40);
      --w25:      rgba(255,255,255,0.25);
      --w12:      rgba(255,255,255,0.12);
      --fade-ms:  400ms;
      --px:       44px;
      --py:       32px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--white);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      cursor: none;
    }

    /* ── CURSOR ─────────────────────────────────────────────── */
    .cursor {
      position: fixed;
      width: 8px; height: 8px;
      background: var(--white);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width .25s ease, height .25s ease;
      mix-blend-mode: difference;
      will-change: left, top;
    }
    .cursor.big { width: 36px; height: 36px; }

    /* ── SLIDESHOW ──────────────────────────────────────────── */
    .slideshow {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      /* Parallax: transition suave en desktop */
      transition: background-position 0.1s ease-out;
      will-change: background-position;
    }
    .slide.active { opacity: 1; }

    /* ── GRAIN CANVAS ────────────────────────────────────────── */
    #grain {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.045;
      mix-blend-mode: overlay;
    }

    /* ── GLITCH OVERLAY ──────────────────────────────────────── */
    .glitch-overlay {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      background: transparent;
      mix-blend-mode: screen;
    }

    /* ── VIÑETA cinematográfica ─────────────────────────────── */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.55) 100%),
        linear-gradient(to top,    rgba(0,0,0,0.82) 0%,  rgba(0,0,0,0.08) 48%, transparent 70%),
        linear-gradient(to bottom, rgba(0,0,0,0.45) 0%,  transparent 22%);
    }

    /* ── FADE OVERLAY (transición entre slides) ─────────────── */
    .fade-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--fade-ms) ease;
    }
    .fade-overlay.on { opacity: 1; }

    /* ── UI LAYER ───────────────────────────────────────────── */
    .ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: var(--py) var(--px);
      pointer-events: none;
    }

    /* ── HEADER ─────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: auto;
    }

    .logo-block {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .logo-block img {
      height: 36px;
      width: auto;
      display: block;
    }

    nav {
      display: flex;
      gap: 26px;
      align-items: center;
      padding-top: 6px;
    }

    nav a {
      display: flex;
      align-items: center;
      color: var(--w40);
      text-decoration: none;
      transition: color .3s ease;
    }

    nav a svg {
      width: 16px;
      height: 16px;
      display: block;
      transition: opacity .3s ease;
    }

    nav a:hover { color: var(--white); }
    nav a::after { display: none; }

    /* ── HERO TEXT ───────────────────────────────────────────── */
    .hero-text {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 6px;
      pointer-events: none;
    }

    h1 {
      font-family: var(--font);
      font-size: clamp(2.2rem, 5.2vw, 4.6rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      text-shadow: 0 2px 40px rgba(0,0,0,0.35);
    }

    .sub {
      margin-top: 14px;
      font-family: var(--font);
      font-size: clamp(10px, 1vw, 12px);
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--w60);
    }

    /* ── FOOTER ─────────────────────────────────────────────── */
    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: flex-end;
      pointer-events: auto;
    }

    .f-email,
    .f-phone {
      font-family: var(--font);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--w25);
    }

    .f-email a, .f-phone a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--w25);
      transition: color .3s, text-decoration-color .3s;
    }
    .f-email a:hover, .f-phone a:hover {
      color: var(--w60);
      text-decoration-color: var(--w60);
    }

    .f-phone { text-align: right; }

    .f-tagline {
      font-family: var(--font);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--w40);
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── CONTROLES ───────────────────────────────────────────── */
    .controls {
      position: fixed;
      bottom: 68px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
    }

    .ctrl {
      background: none;
      border: none;
      cursor: none;
      color: var(--w40);
      transition: color .25s ease;
      padding: 6px;
      display: flex;
      align-items: center;
    }
    .ctrl:hover { color: var(--white); }
    .ctrl svg { width: 18px; height: 18px; display: block; }

    .dots {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .dot {
      width: 4px; height: 4px;
      border-radius: 2px;
      background: var(--w25);
      border: none;
      cursor: none;
      padding: 0;
      transition: background .35s ease, width .35s ease;
    }
    .dot.active {
      background: var(--white);
      width: 20px;
    }

    /* ── MOBILE ─────────────────────────────────────────────── */
    @media (max-width: 768px) {
      :root { --px: 24px; --py: 28px; }

      html, body { cursor: auto; }
      .cursor { display: none; }

      nav { gap: 16px; }

      h1 {
        font-size: clamp(2rem, 9.5vw, 2.6rem);
        line-height: 1.05;
      }

      footer { grid-template-columns: 1fr; row-gap: 3px; }
      .f-phone { display: block; text-align: left; font-size: 9px; }
      .f-email { font-size: 9px; }
      .f-tagline { display: block; font-size: 8px; text-align: left; margin-top: 2px; white-space: normal; }
      .f-location { display: block; }

      .controls {
        bottom: auto;
        top: 80%;
        gap: 12px;
      }

      .dot { width: 6px; height: 6px; }
      .dot.active { width: 22px; }

      .ctrl { cursor: auto; }
      .dot  { cursor: auto; }

      /* Sin grain en móvil (performance) */
      #grain { display: none; }
    }

    @media (max-width: 420px) {
      h1 { font-size: clamp(1.8rem, 9vw, 2.2rem); }
    }
  </style>
</head>

  <script>
    // ═══════════════════════════════════════════════════════
    //  IMÁGENES
    // ═══════════════════════════════════════════════════════
    const desktopImages = [
      'mutual03.jpg','mutual01.jpg','mutual02.jpg',
      'mutual04.jpg','mutual05.jpg','mutual06.jpg',
      'mutual07.jpg','mutual08.jpg','mutual09.jpg'
    ];

    const mobileImages = [
      'mutual03m.jpg','mutual04m.jpg','mutual02m.jpg',
      'mutual01m.jpg','mutual06m.jpg','mutual07m.jpg'
    ];

    // ═══════════════════════════════════════════════════════
    //  CONFIG
    // ═══════════════════════════════════════════════════════
    const DURATION = 5000;
    const FADE_MS  = 400;

    // ── PARALLAX: cuántos px se mueve la foto al cruzar la ventana
    const PARALLAX_PX = 18;

    // ── GLITCH: intensidad del desplazamiento en px
    const GLITCH_SHIFT = 4;

    // ═══════════════════════════════════════════════════════
    //  ESTADO
    // ═══════════════════════════════════════════════════════
    let current      = 0;
    let isPaused     = false;
    let isTransition = false;
    let timer        = null;
    let isMobile     = window.innerWidth <= 768;
    let isPointerFine = window.matchMedia('(pointer: fine)').matches;

    function getImages() { return isMobile ? mobileImages : desktopImages; }

    // ═══════════════════════════════════════════════════════
    //  SLIDES
    // ═══════════════════════════════════════════════════════
    const slideshowEl  = document.getElementById('slideshow');
    const fadeOverlay  = document.getElementById('fadeOverlay');
    const glitchOverlay= document.getElementById('glitchOverlay');
    const dotsEl       = document.getElementById('dots');

    const slides = desktopImages.map((src, i) => {
      const el = document.createElement('div');
      el.className = 'slide' + (i === 0 ? ' active' : '');
      el.style.backgroundImage = `url('${src}')`;
      slideshowEl.appendChild(el);
      return el;
    });

    let dots = [];
    function buildDots() {
      dotsEl.innerHTML = '';
      dots = getImages().map((_, i) => {
        const btn = document.createElement('button');
        btn.className = 'dot' + (i === 0 ? ' active' : '');
        btn.setAttribute('aria-label', `Foto ${i + 1}`);
        btn.addEventListener('click', () => goTo(i));
        dotsEl.appendChild(btn);
        return btn;
      });
    }

    function rebuildSlides() {
      const imgs = getImages();
      slides.forEach((el, i) => {
        if (i < imgs.length) {
          el.style.backgroundImage = `url('${imgs[i]}')`;
          el.style.display = '';
        } else {
          el.classList.remove('active');
          el.style.display = 'none';
        }
      });
      if (current >= imgs.length) current = 0;
    }

    // Precarga
    [...desktopImages, ...mobileImages].forEach(src => {
      const img = new Image(); img.src = src;
    });

    // ═══════════════════════════════════════════════════════
    //  1 · GRAIN ANIMADO
    //  Canvas con ruido aleatorio actualizado a ~8fps
    // ═══════════════════════════════════════════════════════
    (function initGrain() {
      const canvas = document.getElementById('grain');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      let w, h, rafId;
      const FPS = 8;
      let lastTime = 0;

      function resize() {
        // Resolución reducida → mejor performance, igual de visible
        w = canvas.width  = Math.ceil(window.innerWidth  / 2);
        h = canvas.height = Math.ceil(window.innerHeight / 2);
        canvas.style.width  = window.innerWidth  + 'px';
        canvas.style.height = window.innerHeight + 'px';
      }

      function drawGrain(ts) {
        rafId = requestAnimationFrame(drawGrain);
        if (ts - lastTime < 1000 / FPS) return;
        lastTime = ts;

        const img = ctx.createImageData(w, h);
        const d   = img.data;
        for (let i = 0; i < d.length; i += 4) {
          const v = (Math.random() * 255) | 0;
          d[i] = d[i+1] = d[i+2] = v;
          d[i+3] = 255;
        }
        ctx.putImageData(img, 0, 0);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(drawGrain);
    })();

    // ═══════════════════════════════════════════════════════
    //  2 · GLITCH EN TRANSICIÓN
    //  Flash rápido con aberración cromática antes del fade
    // ═══════════════════════════════════════════════════════
    function triggerGlitch() {
      return new Promise(resolve => {
        const overlay = glitchOverlay;
        const activeSlide = slides[current];
        let frame = 0;
        const FRAMES = 5; // ~83ms a 60fps

        // Guardamos el transform original
        const originalTransform = activeSlide.style.transform || '';

        function glitchStep() {
          if (frame >= FRAMES) {
            // Restaurar
            overlay.style.opacity = '0';
            overlay.style.background = 'transparent';
            activeSlide.style.transform = originalTransform;
            activeSlide.style.filter = 'none';
            resolve();
            return;
          }

          const t = frame / FRAMES;

          // Desplazamiento aleatorio
          const dx = (Math.random() - 0.5) * GLITCH_SHIFT * 2;

          // Aberración cromática vía filter
          const rShift = (Math.random() - 0.5) * GLITCH_SHIFT;
          const bShift = (Math.random() - 0.5) * GLITCH_SHIFT;

          activeSlide.style.transform = `translateX(${dx}px)`;
          activeSlide.style.filter =
            `drop-shadow(${rShift}px 0 0 rgba(255,0,0,0.6))
             drop-shadow(${-bShift}px 0 0 rgba(0,150,255,0.6))`;

          // Flash de overlay en el primer frame
          if (frame === 0) {
            overlay.style.background = 'rgba(255,255,255,0.07)';
            overlay.style.opacity = '1';
          } else if (frame === 2) {
            overlay.style.opacity = '0';
          }

          frame++;
          requestAnimationFrame(glitchStep);
        }

        requestAnimationFrame(glitchStep);
      });
    }

    // ═══════════════════════════════════════════════════════
    //  3 · PARALLAX CON EL MOUSE
    //  background-position del slide activo sigue el cursor
    // ═══════════════════════════════════════════════════════
    let mouseX = 0.5, mouseY = 0.5; // normalizados 0–1
    let rafParallax = null;

    function applyParallax() {
      const slide = slides[current];
      if (!slide) return;

      // Centro base = 50% 50%
      // Movimiento: ±PARALLAX_PX alrededor del centro
      const x = 50 + (mouseX - 0.5) * PARALLAX_PX * -1; // invertido = profundidad
      const y = 50 + (mouseY - 0.5) * PARALLAX_PX * -1;

      slide.style.backgroundPosition = `${x.toFixed(2)}% ${y.toFixed(2)}%`;
    }

    if (isPointerFine && !isMobile) {
      document.addEventListener('mousemove', e => {
        mouseX = e.clientX / window.innerWidth;
        mouseY = e.clientY / window.innerHeight;
        cancelAnimationFrame(rafParallax);
        rafParallax = requestAnimationFrame(applyParallax);
      });
    }

    // Resetea parallax del slide anterior al cambiar
    function resetParallax(slideEl) {
      slideEl.style.backgroundPosition = '50% 50%';
    }

    // ═══════════════════════════════════════════════════════
    //  TRANSICIÓN PRINCIPAL (glitch → fade → cambio)
    // ═══════════════════════════════════════════════════════
    async function goTo(index) {
      if (isTransition) return;
      const imgs = getImages();
      const next = ((index % imgs.length) + imgs.length) % imgs.length;
      if (next === current) return;

      isTransition = true;
      clearTimeout(timer);

      // 1 · Glitch (solo desktop con pointer fino)
      if (isPointerFine && !isMobile) {
        await triggerGlitch();
      }

      // 2 · Fade a negro
      fadeOverlay.classList.add('on');

      await wait(FADE_MS);

      // 3 · Cambio de slide
      resetParallax(slides[current]);
      slides[current].classList.remove('active');
      if (dots[current]) dots[current].classList.remove('active');

      current = next;

      slides[current].classList.add('active');
      if (dots[current]) dots[current].classList.add('active');

      // Aplicar parallax actual al nuevo slide
      if (isPointerFine && !isMobile) applyParallax();

      // 4 · Reaparece
      fadeOverlay.classList.remove('on');

      await wait(FADE_MS);

      isTransition = false;
      if (!isPaused) startTimer();
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    const nextSlide = () => goTo(current + 1);
    const prevSlide = () => goTo(current - 1);

    // ═══════════════════════════════════════════════════════
    //  TIMER
    // ═══════════════════════════════════════════════════════
    function startTimer() {
      clearTimeout(timer);
      timer = setTimeout(nextSlide, DURATION);
    }

    // ═══════════════════════════════════════════════════════
    //  PAUSA
    // ═══════════════════════════════════════════════════════
    const iconPause = document.getElementById('iconPause');
    const iconPlay  = document.getElementById('iconPlay');

    function togglePause() {
      isPaused = !isPaused;
      iconPause.style.display = isPaused ? 'none'  : 'block';
      iconPlay.style.display  = isPaused ? 'block' : 'none';
      isPaused ? clearTimeout(timer) : startTimer();
    }

    // ═══════════════════════════════════════════════════════
    //  EVENTOS
    // ═══════════════════════════════════════════════════════
    document.getElementById('prevBtn').addEventListener('click', prevSlide);
    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('pauseBtn').addEventListener('click', togglePause);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft')  prevSlide();
      if (e.key === ' ') { e.preventDefault(); togglePause(); }
    });

    let touchX = 0, touchY = 0;
    document.addEventListener('touchstart', e => {
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 45) {
        dx < 0 ? nextSlide() : prevSlide();
      }
    }, { passive: true });

    // ═══════════════════════════════════════════════════════
    //  CURSOR
    // ═══════════════════════════════════════════════════════
    const cursorEl = document.getElementById('cursor');

    if (isPointerFine) {
      document.addEventListener('mousemove', e => {
        cursorEl.style.left = e.clientX + 'px';
        cursorEl.style.top  = e.clientY + 'px';
      });
      document.querySelectorAll('a, button, .dot').forEach(el => {
        el.addEventListener('mouseenter', () => cursorEl.classList.add('big'));
        el.addEventListener('mouseleave', () => cursorEl.classList.remove('big'));
      });
    }

    // ═══════════════════════════════════════════════════════
    //  RESIZE
    // ═══════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      const wasMobile = isMobile;
      isMobile = window.innerWidth <= 768;
      if (wasMobile !== isMobile) {
        current = 0;
        rebuildSlides();
        buildDots();
      }
    });

    // ═══════════════════════════════════════════════════════
    //  INICIO
    // ═══════════════════════════════════════════════════════
    rebuildSlides();
    buildDots();
    slides[0].classList.add('active');
    startTimer();
  </script>
</body>
</html>
