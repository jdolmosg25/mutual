<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutual Media Group — Audiovisual y Fotografía</title>
  <meta name="description" content="Audiovisual y fotografía. Bogotá." />

  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=montserrat:400,500,700,800&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/png" href="favicon.png" />

  <style>
    :root {
      --bg:       #000000;
      --white:    #ffffff;
      --font:     'Montserrat', sans-serif;
      --w60:      rgba(255,255,255,0.60);
      --w40:      rgba(255,255,255,0.40);
      --w25:      rgba(255,255,255,0.25);
      --w12:      rgba(255,255,255,0.12);
      --fade-ms:  400ms;
      --px:       44px;
      --py:       32px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--white);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      cursor: none;
    }

    /* ── CURSOR ─────────────────────────────────────────────── */
    .cursor {
      position: fixed;
      width: 8px; height: 8px;
      background: var(--white);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width .25s ease, height .25s ease;
      mix-blend-mode: difference;
      will-change: left, top;
    }
    .cursor.big { width: 36px; height: 36px; }

    /* ── SLIDESHOW ──────────────────────────────────────────── */
    .slideshow {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
    }
    .slide.active { opacity: 1; }

    /* ── VIÑETA cinematográfica ─────────────────────────────── */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.55) 100%),
        linear-gradient(to top,    rgba(0,0,0,0.82) 0%,  rgba(0,0,0,0.08) 48%, transparent 70%),
        linear-gradient(to bottom, rgba(0,0,0,0.45) 0%,  transparent 22%);
    }

    /* ── FADE OVERLAY (transición entre slides) ─────────────── */
    .fade-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--fade-ms) ease;
    }
    .fade-overlay.on { opacity: 1; }

    /* ── UI LAYER ───────────────────────────────────────────── */
    .ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: var(--py) var(--px);
      pointer-events: none;
    }

    /* ── HEADER ─────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: auto;
    }

    .logo-block {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .logo-block img {
      height: 36px;
      width: auto;
      display: block;
    }

    nav {
      display: flex;
      gap: 26px;
      align-items: center;
      padding-top: 6px;
    }

    nav a {
      font-family: var(--font);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--w40);
      text-decoration: none;
      transition: color .3s ease;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0; right: 0;
      height: 1px;
      background: var(--white);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .3s ease;
    }

    nav a:hover          { color: var(--white); }
    nav a:hover::after   { transform: scaleX(1); }

    /* ── HERO TEXT ───────────────────────────────────────────── */
    .hero-text {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 6px;
      pointer-events: none;
    }

    h1 {
      font-family: var(--font);
      font-size: clamp(2.2rem, 5.2vw, 4.6rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      text-shadow: 0 2px 40px rgba(0,0,0,0.35);
    }

    .sub {
      margin-top: 14px;
      font-family: var(--font);
      font-size: clamp(10px, 1vw, 12px);
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--w60);
    }

    /* ── FOOTER ─────────────────────────────────────────────── */
    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: flex-end;
      pointer-events: auto;
    }

    .f-email,
    .f-phone {
      font-family: var(--font);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--w25);
    }

    .f-email a, .f-phone a {
      color: inherit;
      text-decoration: none;
      transition: color .3s;
    }
    .f-email a:hover, .f-phone a:hover { color: var(--w60); }

    .f-phone { text-align: right; }

    .f-legal {
      font-family: var(--font);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--w12);
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── CONTROLES (flechas + dots + pausa) ─────────────────── */
    .controls {
      position: fixed;
      bottom: 68px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
    }

    .ctrl {
      background: none;
      border: none;
      cursor: none;
      color: var(--w40);
      transition: color .25s ease;
      padding: 6px;
      display: flex;
      align-items: center;
    }
    .ctrl:hover { color: var(--white); }
    .ctrl svg { width: 18px; height: 18px; display: block; }

    .dots {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .dot {
      width: 4px; height: 4px;
      border-radius: 2px;
      background: var(--w25);
      border: none;
      cursor: none;
      padding: 0;
      transition: background .35s ease, width .35s ease;
    }
    .dot.active {
      background: var(--white);
      width: 20px;
    }

    /* ── MOBILE ─────────────────────────────────────────────── */
    @media (max-width: 768px) {
      :root { --px: 24px; --py: 28px; }

      html, body { cursor: auto; }
      .cursor { display: none; }

      nav { gap: 16px; }

      /* Texto más chico para que quepa en una sola línea */
      h1 {
        font-size: clamp(2rem, 9.5vw, 2.6rem);
        line-height: 1.05;
      }

      /* Footer solo muestra email, en una columna */
      footer { grid-template-columns: 1fr; }
      .f-legal, .f-phone { display: none; }
      .f-email { font-size: 9px; }

      /* Controles: suben para no chocar con el footer */
      .controls {
        bottom: 52px;
        gap: 12px;
      }

      /* Dots un poco más grandes para ser tocables */
      .dot { width: 6px; height: 6px; }
      .dot.active { width: 22px; }

      /* Cursor táctil */
      .ctrl { cursor: auto; }
      .dot  { cursor: auto; }
    }

    @media (max-width: 420px) {
      h1 { font-size: clamp(1.8rem, 9vw, 2.2rem); }
    }
  </style>
</head>
<body>

  <!-- Cursor -->
  <div class="cursor" id="cursor"></div>

  <!-- Slideshow -->
  <div class="slideshow" id="slideshow"></div>

  <!-- Viñeta -->
  <div class="vignette"></div>

  <!-- Fade overlay -->
  <div class="fade-overlay" id="fadeOverlay"></div>

  <!-- UI -->
  <div class="ui">
    <header>
      <div class="logo-block">
        <img src="logo.png" alt="Mutual Media Group" />
      </div>
      <nav>
        <a href="https://www.behance.net/juandmutual"   target="_blank" rel="noopener">BE</a>
        <a href="https://www.vimeo.com/juandmutual"     target="_blank" rel="noopener">VI</a>
        <a href="https://www.instagram.com/juandmutual" target="_blank" rel="noopener">IG</a>
      </nav>
    </header>

    <div class="hero-text">
      <h1>Audiovisual<br>y Fotografía.</h1>
    </div>

    <footer>
      <div class="f-email">
        Juan de Mutual &ensp;·&ensp; <a href="mailto:proyectos@mutualmediagroup.com">proyectos@mutualmediagroup.com</a>
      </div>
      <div class="f-legal">Bogotá &ensp;·&ensp; © 2026 Mutual Media Group</div>
      <div class="f-phone">
        <a href="https://wa.me/573156372648" target="_blank" rel="noopener">+57 315 637 2648</a>
      </div>
    </footer>
  </div>

  <!-- Controles -->
  <div class="controls">
    <button class="ctrl" id="prevBtn" aria-label="Foto anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <div class="dots" id="dots"></div>

    <button class="ctrl" id="pauseBtn" aria-label="Pausar">
      <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6"  y="4" width="4" height="16" rx="1"/>
        <rect x="14" y="4" width="4" height="16" rx="1"/>
      </svg>
      <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor" style="display:none">
        <path d="M8 5.14v14l11-7-11-7z"/>
      </svg>
    </button>

    <button class="ctrl" id="nextBtn" aria-label="Foto siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════
    //  TUS IMÁGENES — mismos nombres que tenías
    // ═══════════════════════════════════════════════════════
    const desktopImages = [
      'mutual03.jpg',
      'mutual01.jpg',
      'mutual02.jpg',
      'mutual04.jpg',
      'mutual05.jpg',
      'mutual06.jpg',
      'mutual07.jpg',
      'mutual08.jpg',
      'mutual09.jpg'
    ];

    const mobileImages = [
      'mutual03m.jpg',
      'mutual04m.jpg',
      'mutual02m.jpg',
      'mutual01m.jpg',
      'mutual06m.jpg',
      'mutual07m.jpg'
    ];

    // ═══════════════════════════════════════════════════════
    //  CONFIG
    // ═══════════════════════════════════════════════════════
    const DURATION = 5000;   // ms por foto
    const FADE_MS  = 400;    // ms del fade a negro

    // ═══════════════════════════════════════════════════════
    //  ESTADO
    // ═══════════════════════════════════════════════════════
    let current      = 0;
    let isPaused     = false;
    let isTransition = false;
    let timer        = null;
    let isMobile     = window.innerWidth <= 768;

    function getImages() { return isMobile ? mobileImages : desktopImages; }

    // ═══════════════════════════════════════════════════════
    //  CONSTRUCCIÓN DE SLIDES
    // ═══════════════════════════════════════════════════════
    const slideshowEl = document.getElementById('slideshow');
    const fadeOverlay = document.getElementById('fadeOverlay');
    const dotsEl      = document.getElementById('dots');

    // Creamos slides con todas las imágenes desktop
    // (en mobile cambiamos backgroundImage al vuelo)
    const slides = desktopImages.map((src, i) => {
      const el = document.createElement('div');
      el.className = 'slide' + (i === 0 ? ' active' : '');
      el.style.backgroundImage = `url('${src}')`;
      slideshowEl.appendChild(el);
      return el;
    });

    // Construimos dots según el set activo
    let dots = [];
    function buildDots() {
      dotsEl.innerHTML = '';
      dots = getImages().map((_, i) => {
        const btn = document.createElement('button');
        btn.className = 'dot' + (i === 0 ? ' active' : '');
        btn.setAttribute('aria-label', `Foto ${i + 1}`);
        btn.addEventListener('click', () => goTo(i));
        dotsEl.appendChild(btn);
        return btn;
      });
    }

    // Actualiza backgroundImage de cada slide según mobile/desktop
    function rebuildSlides() {
      const imgs = getImages();
      // Ajustamos cuántos slides son visibles
      slides.forEach((el, i) => {
        if (i < imgs.length) {
          el.style.backgroundImage = `url('${imgs[i]}')`;
          el.style.display = '';
        } else {
          el.classList.remove('active');
          el.style.display = 'none';
        }
      });
      if (current >= imgs.length) current = 0;
    }

    // Precarga
    [...desktopImages, ...mobileImages].forEach(src => {
      const img = new Image(); img.src = src;
    });

    // ═══════════════════════════════════════════════════════
    //  TRANSICIÓN (fade a negro)
    // ═══════════════════════════════════════════════════════
    function goTo(index) {
      if (isTransition) return;
      const imgs = getImages();
      const next = ((index % imgs.length) + imgs.length) % imgs.length;
      if (next === current) return;

      isTransition = true;
      clearTimeout(timer);

      // 1 · Negro
      fadeOverlay.classList.add('on');

      setTimeout(() => {
        slides[current].classList.remove('active');
        if (dots[current]) dots[current].classList.remove('active');

        current = next;

        slides[current].classList.add('active');
        if (dots[current]) dots[current].classList.add('active');

        // 2 · Reaparece
        fadeOverlay.classList.remove('on');

        setTimeout(() => {
          isTransition = false;
          if (!isPaused) startTimer();
        }, FADE_MS);

      }, FADE_MS);
    }

    const nextSlide = () => goTo(current + 1);
    const prevSlide = () => goTo(current - 1);

    // ═══════════════════════════════════════════════════════
    //  TIMER
    // ═══════════════════════════════════════════════════════
    function startTimer() {
      clearTimeout(timer);
      timer = setTimeout(nextSlide, DURATION);
    }

    // ═══════════════════════════════════════════════════════
    //  PAUSA
    // ═══════════════════════════════════════════════════════
    const iconPause = document.getElementById('iconPause');
    const iconPlay  = document.getElementById('iconPlay');

    function togglePause() {
      isPaused = !isPaused;
      iconPause.style.display = isPaused ? 'none'  : 'block';
      iconPlay.style.display  = isPaused ? 'block' : 'none';
      isPaused ? clearTimeout(timer) : startTimer();
    }

    // ═══════════════════════════════════════════════════════
    //  EVENTOS — botones
    // ═══════════════════════════════════════════════════════
    document.getElementById('prevBtn').addEventListener('click', prevSlide);
    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('pauseBtn').addEventListener('click', togglePause);

    // ═══════════════════════════════════════════════════════
    //  EVENTOS — teclado
    // ═══════════════════════════════════════════════════════
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft')  prevSlide();
      if (e.key === ' ') { e.preventDefault(); togglePause(); }
    });

    // ═══════════════════════════════════════════════════════
    //  TOUCH — swipe
    // ═══════════════════════════════════════════════════════
    let touchX = 0, touchY = 0;

    document.addEventListener('touchstart', e => {
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 45) {
        dx < 0 ? nextSlide() : prevSlide();
      }
    }, { passive: true });

    // ═══════════════════════════════════════════════════════
    //  CURSOR (solo desktop / pointer fino)
    // ═══════════════════════════════════════════════════════
    const cursorEl = document.getElementById('cursor');

    if (window.matchMedia('(pointer: fine)').matches) {
      let cx = -100, cy = -100;

      document.addEventListener('mousemove', e => {
        cx = e.clientX; cy = e.clientY;
        cursorEl.style.left = cx + 'px';
        cursorEl.style.top  = cy + 'px';
      });

      document.querySelectorAll('a, button, .dot').forEach(el => {
        el.addEventListener('mouseenter', () => cursorEl.classList.add('big'));
        el.addEventListener('mouseleave', () => cursorEl.classList.remove('big'));
      });
    }

    // ═══════════════════════════════════════════════════════
    //  RESIZE — reconstruye si cambia breakpoint
    // ═══════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      const wasMobile = isMobile;
      isMobile = window.innerWidth <= 768;
      if (wasMobile !== isMobile) {
        current = 0;
        rebuildSlides();
        buildDots();
      }
    });

    // ═══════════════════════════════════════════════════════
    //  INICIO
    // ═══════════════════════════════════════════════════════
    rebuildSlides();
    buildDots();
    slides[0].classList.add('active');
    startTimer();
  </script>
</body>
</html>
