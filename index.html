<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutual Media Group — Fotografía y Producción Audiovisual</title>
  <style>
    :root {
      --bg: #ffffff; /* Fondo oscuro para resaltar el logo blanco */
      --white: #FFFFFF;
      --font-serif: 'Instrument Serif', serif;
      --font-sans: 'DM Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--white);
      font-family: var(--font-sans);
      overflow: hidden; /* Evita el scroll ya que solo es una pantalla */
    }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px;
      background-size: cover;
      background-position: center;
      transition: background-image 1s ease-in-out;
    }

    /* Logo superior */
    .logo img {
      height: 40px;
      width: auto;
      display: block;
    }

    /* Copy central/inferior */
    .hero-content {
      max-width: 800px;
      z-index: 2;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* Controles discretos */
    .slider-controls {
      position: absolute;
      top: 50%;
      width: calc(100% - 80px);
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .slider-controls button {
      background: none;
      border: none;
      color: var(--white);
      font-size: 2rem;
      cursor: pointer;
      opacity: 0.2;
      transition: opacity 0.3s;
      pointer-events: auto;
    }

    .slider-controls button:hover { opacity: 1; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@400&display=swap" rel="stylesheet" />
</head>
<body>

  <section class="hero" id="hero">
    <div class="logo">
      <img src="logo.png" alt="Mutual">
    </div>

    <div class="hero-content">
      <h1>Habitar los espacios</h1>
      <p>Arquitectura y fotografía documental</p>
    </div>

    <div class="slider-controls">
      <button onclick="moveSlider(-1)">&#10229;</button>
      <button onclick="moveSlider(1)">&#10230;</button>
    </div>
  </section>

  <script>
    // 1. LISTA DE TUS FOTOS: Asegúrate de que estos nombres coincidan con tus archivos en GitHub
    const images = [
      'mutual03.jpg',
      'mutual01.jpg', 
      'mutual02.jpg', 
      'home01.jpg'
    ]; 
    
    let currentIndex = 0;
    const hero = document.getElementById('hero');

    function updateHero() {
      hero.style.backgroundImage = `linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.1) 100%), url('${images[currentIndex]}')`;
    }

    function moveSlider(direction) {
      currentIndex = (currentIndex + direction + images.length) % images.length;
      updateHero();
    }

    // Auto-play cada 6 segundos
    let timer = setInterval(() => moveSlider(1), 6000);

    // Pausar al pasar el mouse
    hero.addEventListener('mouseenter', () => clearInterval(timer));
    hero.addEventListener('mouseleave', () => timer = setInterval(() => moveSlider(1), 6000));

    // Iniciar
    updateHero();
  </script>
</body>
</html>
