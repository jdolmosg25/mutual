  <style>
    /* ── VARIABLES ── */
    :root {
      --bg:      #000000;
      --white:   #ffffff;
      --font:    'Montserrat', sans-serif;
      --w60:     rgba(255,255,255,0.60);
      --w40:     rgba(255,255,255,0.40);
      --w25:     rgba(255,255,255,0.25);
      --fade-ms: 400ms;
      --px:      44px;
      --py:      32px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--white);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      cursor: none;
    }

    /* ── CURSOR ── */
    .cursor {
      position: fixed;
      width: 8px; height: 8px;
      background: var(--white);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width .25s ease, height .25s ease;
      mix-blend-mode: difference;
      will-change: left, top;
    }
    .cursor.big  { width: 36px; height: 36px; }
    .cursor.link {
      transition: none;
      animation: cursorBreathe 2.2s ease-in-out infinite;
    }

    @keyframes cursorBreathe {
      0%   { width: 8px;  height: 8px;  }
      50%  { width: 36px; height: 36px; }
      100% { width: 8px;  height: 8px;  }
    }

    /* ── SLIDESHOW ── */
    .slideshow { position: fixed; inset: 0; z-index: 0; }

    .slide {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0;
      transition: background-position 0.1s ease-out;
      will-change: background-position;
    }
    .slide.active { opacity: 1; }

    /* ── GRAIN ── */
    #grain {
      position: fixed; inset: 0; z-index: 3;
      pointer-events: none; opacity: 0.045;
      mix-blend-mode: overlay;
    }

    /* ── OVERLAYS ── */
    .glitch-overlay {
      position: fixed; inset: 0; z-index: 4;
      pointer-events: none; opacity: 0;
      background: transparent; mix-blend-mode: screen;
    }

    .vignette {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.35) 100%),
        linear-gradient(to top,    rgba(0,0,0,0.60) 0%, rgba(0,0,0,0.04) 48%, transparent 70%),
        linear-gradient(to bottom, rgba(0,0,0,0.28) 0%, transparent 22%);
    }

    .fade-overlay {
      position: fixed; inset: 0; background: var(--bg);
      z-index: 5; opacity: 0; pointer-events: none;
      transition: opacity var(--fade-ms) ease;
    }
    .fade-overlay.on { opacity: 1; }

    /* ── UI / HEADER ── */
    .ui {
      position: fixed; inset: 0; z-index: 10;
      display: grid; grid-template-rows: auto 1fr auto;
      padding: var(--py) var(--px); pointer-events: none;
    }

    header {
      display: flex; align-items: flex-start;
      justify-content: space-between; pointer-events: auto;
    }

    .logo-block { display: flex; flex-direction: column; gap: 5px; }
    .logo-block img { height: 36px; width: auto; display: block; }

    nav { display: flex; gap: 26px; align-items: center; padding-top: 6px; }

    nav a {
      display: flex; align-items: center;
      color: var(--white); text-decoration: none;
      transition: color .3s ease;
    }
    nav a svg { width: 16px; height: 16px; display: block; }
    nav a:hover { color: var(--w60); }
    nav a::after { display: none; }

    .hero-text {
      display: flex; flex-direction: column;
      justify-content: flex-end; padding-bottom: 6px; pointer-events: none;
    }

    /* ── FOOTER ── */
    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto auto;
      align-items: end;
      pointer-events: auto;
    }

    .f-email, .f-phone {
      font-family: var(--font); font-size: 10px;
      font-weight: 400; letter-spacing: 0.06em;
      color: var(--white);
    }

    .f-email a, .f-phone a {
      color: inherit; text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: rgba(255,255,255,0.4);
      transition: color .3s, text-decoration-color .3s;
    }
    .f-email a:hover, .f-phone a:hover {
      color: var(--w60); text-decoration-color: var(--w60);
    }

    .f-phone { text-align: right; }

    .f-tagline {
      font-family: var(--font); font-size: 10px;
      font-weight: 400; letter-spacing: 0.12em;
      color: var(--white); text-align: center;
    }
    .f-tagline .f-line1,
    .f-tagline .f-line2 { display: block; white-space: nowrap; }
    .f-tagline .f-line2 { margin-top: 4px; opacity: 0.75; letter-spacing: 0.06em; }

    /* Título solo para buscadores y lectores de pantalla (no se ve) */
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .f-copy {
      grid-column: 2;
      font-family: var(--font); font-size: 10px;
      font-weight: 400; letter-spacing: 0.12em;
      color: var(--white); opacity: 0.55;
      text-align: center; white-space: nowrap;
      margin-top: 4px;
    }

    /* ── CONTROLES ── */
    .controls {
      position: fixed; bottom: 80px; left: 50%;
      transform: translateX(-50%); z-index: 20;
      display: flex; align-items: center; gap: 16px; pointer-events: auto;
    }

    .ctrl {
      background: none; border: none; cursor: none;
      color: var(--w40); transition: color .25s ease;
      padding: 6px; display: flex; align-items: center;
    }
    .ctrl:hover { color: var(--white); }
    .ctrl svg { width: 18px; height: 18px; display: block; }

    .dots { display: flex; gap: 7px; align-items: center; }

    .dot {
      width: 4px; height: 4px; border-radius: 2px;
      background: var(--w25); border: none; cursor: none; padding: 0;
      transition: background .35s ease, width .35s ease;
    }
    .dot.active { background: var(--white); width: 20px; }

    /* ── CTA WHATSAPP ── */
    .cta-wa {
      position: fixed; bottom: 80px; right: var(--px); z-index: 20;
      display: flex; align-items: center; gap: 8px;
      color: var(--white); text-decoration: none;
      font-family: var(--font); font-size: 10px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      transition: color .3s ease; pointer-events: auto;
    }
    .cta-wa::after { content: '→'; font-size: 12px; transition: transform .3s ease; }
    .cta-wa:hover { color: var(--w60); }
    .cta-wa:hover::after { transform: translateX(4px); }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      :root { --px: 24px; --py: 28px; }
      html, body { cursor: auto; }
      .cursor { display: none; }
      nav { gap: 12px; }
      nav a svg { width: 14px; height: 14px; }
      footer {
        grid-template-columns: 1fr;
        grid-template-rows: unset;
        row-gap: 3px;
      }
      .f-email   { font-size: 9px; order: 1; }
      .f-tagline { font-size: 8px; text-align: left; order: 2; }
      .f-tagline .f-line1,
      .f-tagline .f-line2 { display: block; white-space: normal; }
      .f-phone   { display: block; text-align: left; font-size: 9px; order: 3; }
      .f-copy    { grid-column: unset; text-align: left; font-size: 8px; margin-top: 0; order: 4; white-space: normal; }
      .controls  { bottom: auto; top: 80%; gap: 12px; }
      .dot       { width: 6px; height: 6px; }
      .dot.active { width: 22px; }
      .ctrl      { cursor: auto; }
      .dot       { cursor: auto; }
      #grain     { display: none; }
      .cta-wa {
        bottom: auto;
        top: calc(80% - 40px);
        right: unset;
        left: 50%;
        transform: translateX(-50%);
        font-size: 9px;
      }
    }

    @media (max-width: 420px) {
      h1 { font-size: clamp(1.8rem, 9vw, 2.2rem); }
    }
  </style>
</head>

  <div class="vignette"></div>
  <div class="fade-overlay" id="fadeOverlay"></div>

  <div class="ui">

      <div class="logo-block">
        <img src="logo.png" alt="Mutual Media Group" />
      </div>
      <nav>
        <a href="https://www.behance.net/juandmutual" target="_blank"
