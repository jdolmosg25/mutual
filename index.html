<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutual Media Group — Fotografía y Producción Audiovisual</title>
  <style>
    :root {
      --bg: #1A1A18;
      --white: #FFFFFF;
      --font-serif: 'Instrument Serif', serif;
      --font-sans: 'Montserrat', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--white);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 50px; /* Más aire en los bordes generales */
      background-size: cover;
      background-position: center;
      transition: background-image 1s ease-in-out;
    }

    /* Logo superior */
    .logo img {
      height: 38px;
      width: auto;
      display: block;
    }

    /* Contenido inferior izquierdo (Copy más limpio y protegido) */
    .hero-content {
      max-width: 780px;
      z-index: 2;
      margin-top: auto;
      margin-bottom: 20px;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.4rem, 4.8vw, 4rem);
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 18px;
      /* Sombra ambiental para que el texto serif respire sobre nubes/fondos claros */
      text-shadow: 0px 4px 20px rgba(0, 0, 0, 0.6), 0px 2px 5px rgba(0, 0, 0, 0.4);
    }

    p {
      font-family: var(--font-sans) !important; /* Forzado Montserrat */
      font-weight: 400;
      font-size: clamp(0.75rem, 1.1vw, 0.85rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.9;
      line-height: 1.7;
      text-shadow: 0px 2px 10px rgba(0, 0, 0, 0.6);
    }

    /* Controles del Slider */
    .slider-controls {
      position: absolute;
      top: 50%;
      left: 40px;
      width: calc(100% - 80px);
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
      transform: translateY(-50%);
    }

    .slider-controls button {
      background: none;
      border: none;
      color: var(--white);
      font-size: 2rem;
      cursor: pointer;
      opacity: 0.2;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: auto;
    }

    .slider-controls button:hover { 
      opacity: 0.8;
      transform: scale(1.1);
    }

    /* Redes Flotantes (Derecha vertical) */
    .social-links {
      position: absolute;
      right: 50px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 32px;
      z-index: 5;
    }

    .social-links a {
      color: var(--white) !important;
      text-decoration: none;
      font-family: var(--font-sans) !important; /* Forzado Montserrat en links */
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.5;
      transition: all 0.3s ease;
      writing-mode: vertical-rl;
      text-shadow: 0px 2px 8px rgba(0,0,0,0.5);
    }

    .social-links a:hover { 
      opacity: 1;
      transform: translateY(-3px);
    }

    /* Info de contacto (Inferior Derecha) */
    .contact-info {
      position: absolute;
      right: 50px;
      bottom: 50px;
      text-align: right;
      z-index: 5;
    }

    .contact-info a {
      display: block;
      color: var(--white) !important;
      text-decoration: none;
      font-family: var(--font-sans) !important; /* Forzado Montserrat en datos de contacto */
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      opacity: 0.6;
      margin-top: 10px;
      transition: all 0.3s ease;
      text-shadow: 0px 2px 8px rgba(0,0,0,0.5);
    }

    .contact-info a:hover { 
      opacity: 1;
      transform: translateX(-4px);
    }

    /* ==========================================
       DIAGRAMACIÓN MÓVIL OPTIMIZADA
       ========================================== */
    @media (max-width: 768px) {
      .hero {
        padding: 40px 30px;
        background-position: center center; 
        justify-content: flex-start;
      }

      .logo {
        margin-bottom: auto;
      }

      .hero-content {
        margin-top: 0;
        margin-bottom: 180px; /* Espacio extra para que el texto respire arriba del menú móvil */
        max-width: 100%;
      }

      h1 {
        font-size: 2rem;
        line-height: 1.2;
        margin-bottom: 14px;
      }

      p {
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        line-height: 1.6;
      }

      /* Bloque de contacto abajo a la izquierda */
      .contact-info {
        left: 30px;
        right: auto;
        bottom: 85px;
        text-align: left;
      }

      .contact-info a {
        font-size: 0.72rem;
        margin-top: 6px;
      }

      /* Redes horizontales al fondo */
      .social-links {
        position: absolute;
        left: 30px;
        right: auto;
        bottom: 40px;
        top: auto;
        transform: none;
        flex-direction: row; 
        gap: 24px;
        width: auto;
      }

      .social-links a {
        writing-mode: horizontal-tb; 
        font-size: 0.68rem;
        letter-spacing: 0.12em;
      }

      .slider-controls {
        display: none;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <section class="hero" id="hero">
    <div class="logo">
      <img src="logo.png" alt="Mutual">
    </div>

    <div class="hero-content">
      <h1>Productora audiovisual y fotografía especializada.</h1>
      <p>Desarrollo de proyectos visuales desde el rigor técnico y la narrativa documental. Dirigidos por Juan de Mutual.</p>
    </div>

    <div class="social-links">
      <a href="https://www.behance.net/juandmutual" target="_blank">Behance</a>
      <a href="https://www.vimeo.com/juandmutual" target="_blank">Vimeo</a>
      <a href="https://www.instagram.com/juandmutual" target="_blank">Instagram</a>
    </div>

    <div class="contact-info">
      <a href="mailto:proyectos@mutualmediagroup.com">proyectos@mutualmediagroup.com</a>
      <a href="https://wa.me/573156372648" target="_blank">+57 315 637 2648</a>
    </div>

    <div class="slider-controls">
      <button onclick="moveSlider(-1)">&#10229;</button>
      <button onclick="moveSlider(1)">&#10230;</button>
    </div>
  </section>

  <script>
    const desktopImages = [
      'mutual03.jpg',
      'mutual01.jpg',
      'mutual02.jpg',
      'mutual04.jpg',
      'mutual05.jpg',
      'mutual06.jpg',
      'mutual07.jpg',
      'mutual08.jpg',
      'mutual09.jpg'
    ]; 

    const mobileImages = [
      'mutual03_mv.jpg',
      'mutual01_mv.jpg',
      'mutual02_mv.jpg',
      'mutual04_mv.jpg',
      'mutual05_mv.jpg',
      'mutual06_mv.jpg',
      'mutual07_mv.jpg',
      'mutual08_mv.jpg',
      'mutual09_mv.jpg'
    ]; 
    
    let currentIndex = 0;
    const hero = document.getElementById('hero');

    function updateHero() {
      if(hero) {
        const isMobile = window.innerWidth <= 768;
        const currentList = isMobile ? mobileImages : desktopImages;
        
        hero.style.backgroundImage = `linear-gradient(180deg, rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.0) 100%), url('${currentList[currentIndex]}')`;
      }
    }

    function moveSlider(direction) {
      currentIndex = (currentIndex + direction + desktopImages.length) % desktopImages.length;
      updateHero();
    }

    let timer = setInterval(() => moveSlider(1), 3000);

    hero.addEventListener('mouseenter', () => clearInterval(timer));
    hero.addEventListener('mouseleave', () => timer = setInterval(() => moveSlider(1), 3000));

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight') moveSlider(1);
      else if (event.key === 'ArrowLeft') moveSlider(-1);
    });

    window.addEventListener('resize', updateHero);

    updateHero();
  </script>
</body>
</html>
