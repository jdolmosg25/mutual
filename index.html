<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutual Media Group — Fotografía y Producción Audiovisual</title>
  <style>
    :root {
      --bg: #1A1A18;
      --white: #FFFFFF;
      --font-serif: 'Instrument Serif', serif;
      --font-sans: 'Montserrat', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--white);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 50px;
      background-size: cover;
      background-position: center;
      transition: background-image 1s ease-in-out;
    }

    /* Contenedor Superior (Logo + Redes horizontales alineados) */
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      z-index: 10;
    }

    .logo img {
      height: 38px;
      width: auto;
      display: block;
    }

    /* Redes Horizontales Superiores (Forzado Montserrat) */
    .social-links {
      display: flex;
      gap: 32px;
    }

    .social-links a {
      color: var(--white) !important;
      text-decoration: none;
      font-family: var(--font-sans) !important;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.55;
      transition: all 0.3s ease;
      text-shadow: 0px 2px 8px rgba(0,0,0,0.5);
    }

    .social-links a:hover { 
      opacity: 1;
      transform: translateY(-2px);
    }

    /* Contenido inferior izquierdo (Copy unificado) */
    .hero-content {
      max-width: 780px;
      z-index: 2;
      margin-top: auto;
      margin-bottom: 20px;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.4rem, 4.8vw, 4rem);
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 18px;
      text-shadow: 0px 4px 20px rgba(0, 0, 0, 0.6), 0px 2px 5px rgba(0, 0, 0, 0.4);
    }

    p {
      font-family: var(--font-sans) !important;
      font-weight: 400;
      font-size: clamp(0.75rem, 1.1vw, 0.85rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.9;
      line-height: 1.7;
      text-shadow: 0px 2px 10px rgba(0, 0, 0, 0.6);
    }

    /* Controles del Slider (Flechas Libres a los costados) */
    .slider-controls {
      position: absolute;
      top: 50%;
      left: 40px;
      width: calc(100% - 80px);
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
      transform: translateY(-50%);
    }

    .slider-controls button {
      background: none;
      border: none;
      color: var(--white);
      font-size: 2rem;
      cursor: pointer;
      opacity: 0.2;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: auto;
    }

    .slider-controls button:hover { 
      opacity: 0.8;
      transform: scale(1.1);
    }

    /* Info de contacto (Inferior Derecha) */
    .contact-info {
      position: absolute;
      right: 50px;
      bottom: 50px;
      text-align: right;
      z-index: 5;
    }

    .contact-info a {
      display: block;
      color: var(--white) !important;
      text-decoration: none;
      font-family: var(--font-sans) !important;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      opacity: 0.6;
      margin-top: 10px;
      transition: all 0.3s ease;
      text-shadow: 0px 2px 8px rgba(0,0,0,0.5);
    }

    .contact-info a:hover { 
      opacity: 1;
      transform: translateX(-4px);
    }

    /* ==========================================
       DIAGRAMACIÓN MÓVIL OPTIMIZADA
       ========================================== */
    @media (max-width: 768px) {
      .hero {
        padding: 40px 30px;
        background-position: center center; 
        justify-content: flex-start;
      }

      .header-top {
        align-items: flex-start;
        margin-bottom: auto; /* Mantiene el logo arriba */
      }

      /* En celulares ocultamos el menú superior para usar la base horizontal inferior limpia */
      .header-top .social-links {
        display: none;
      }

      .hero-content {
        margin-top: 0;
        margin-bottom: 180px; 
        max-width: 100%;
      }

      h1 {
        font-size: 2rem;
        line-height: 1.2;
        margin-bottom: 14px;
      }

      p {
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        line-height: 1.6;
      }

      /* Bloque de contacto abajo a la izquierda */
      .contact-info {
        left: 30px;
        right: auto;
        bottom: 85px;
        text-align: left;
      }

      .contact-info a {
        font-size: 0.72rem;
        margin-top: 6px;
      }

      /* Redes horizontales al fondo exclusivas de mobile */
      .mobile-social {
        display: flex;
        position: absolute;
        left: 30px;
        right: auto;
        bottom: 40px;
        top: auto;
        transform: none;
        gap: 24px;
        width: auto;
        z-index: 5;
      }

      .mobile-social a {
        color: var(--white) !important;
        text-decoration: none;
        font-family: var(--font-sans) !important;
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.55;
      }

      .slider-controls {
        display: none;
      }
    }

    /* Ocultar el contenedor móvil en pantallas de escritorio */
    @media (min-width: 769px) {
      .mobile-social {
        display: none;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
