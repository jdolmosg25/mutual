<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutual Media Group — Fotografía y Producción Audiovisual</title>
  <style>
    :root {
      --bg: #1A1A18;
      --white: #FFFFFF;
      --font-serif: 'Instrument Serif', serif;
      --font-sans: 'Montserrat', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--white);
      font-family: var(--font-sans);
      overflow: hidden; /* Evita scrolls innecesarios en la entrega inicial */
    }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px;
      background-size: cover;
      background-position: center;
      transition: background-image 1s ease-in-out;
    }

    /* Logo superior */
    .logo img {
      height: 40px;
      width: auto;
      display: block;
    }

    /* Contenido inferior izquierdo (Copy pulido y diagramado) */
    .hero-content {
      max-width: 750px;
      z-index: 2;
      margin-top: auto;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 4.5vw, 3.8rem);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 16px;
      text-shadow: 0px 2px 15px rgba(0,0,0,0.3);
    }

    p {
      font-family: var(--font-sans);
      font-weight: 400;
      font-size: clamp(0.75rem, 1.1vw, 0.85rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.85;
      line-height: 1.6;
      text-shadow: 0px 2px 10px rgba(0,0,0,0.3);
    }

    /* Controles discretos del Slider (Flechas finas laterales) */
    .slider-controls {
      position: absolute;
      top: 50%;
      left: 40px;
      width: calc(100% - 80px);
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
      transform: translateY(-50%);
    }

    .slider-controls button {
      background: none;
      border: none;
      color: var(--white);
      font-size: 2rem;
      cursor: pointer;
      opacity: 0.2;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: auto;
    }

    .slider-controls button:hover { 
      opacity: 0.8;
      transform: scale(1.1);
    }

    /* Redes Flotantes (Derecha en formato vertical elegante) */
    .social-links {
      position: absolute;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 5;
    }

    .social-links a {
      color: var(--white);
      text-decoration: none;
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.4;
      transition: opacity 0.3s;
