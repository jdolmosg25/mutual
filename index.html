  <style>
    /* ── VARIABLES ── */
    :root {
      --bg:      #000000;
      --white:   #ffffff;
      --font:    'Montserrat', sans-serif;
      --w60:     rgba(255,255,255,0.60);
      --w40:     rgba(255,255,255,0.40);
      --w25:     rgba(255,255,255,0.25);
      --fade-ms: 400ms;
      --px:      44px;
      --py:      32px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--white);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      cursor: none;
    }

    /* ── CURSOR ── */
    .cursor {
      position: fixed;
      width: 8px; height: 8px;
      background: var(--white);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width .25s ease, height .25s ease;
      mix-blend-mode: difference;
      will-change: left, top;
    }
    .cursor.big { width: 36px; height: 36px; }

    /* ── SLIDESHOW ── */
    .slideshow { position: fixed; inset: 0; z-index: 0; }

    .slide {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0;
      transition: background-position 0.1s ease-out;
      will-change: background-position;
    }
    .slide.active { opacity: 1; }

    /* ── GRAIN ── */
    #grain {
      position: fixed; inset: 0; z-index: 3;
      pointer-events: none; opacity: 0.045;
      mix-blend-mode: overlay;
    }

    /* ── OVERLAYS ── */
    .glitch-overlay {
      position: fixed; inset: 0; z-index: 4;
      pointer-events: none; opacity: 0;
      background: transparent; mix-blend-mode: screen;
    }

    .vignette {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.35) 100%),
        linear-gradient(to top,    rgba(0,0,0,0.60) 0%, rgba(0,0,0,0.04) 48%, transparent 70%),
        linear-gradient(to bottom, rgba(0,0,0,0.28) 0%, transparent 22%);
    }

    .fade-overlay {
      position: fixed; inset: 0; background: var(--bg);
      z-index: 5; opacity: 0; pointer-events: none;
      transition: opacity var(--fade-ms) ease;
    }
    .fade-overlay.on { opacity: 1; }

    /* ── UI / HEADER ── */
    .ui {
      position: fixed; inset: 0; z-index: 10;
      display: grid; grid-template-rows: auto 1fr auto;
      padding: var(--py) var(--px); pointer-events: none;
    }

    header {
      display: flex; align-items: flex-start;
      justify-content: space-between; pointer-events: auto;
    }

    .logo-block { display: flex; flex-direction: column; gap: 5px; }
    .logo-block img { height: 36px; width: auto; display: block; }

    nav { display: flex; gap: 26px; align-items: center; padding-top: 6px; }

    nav a {
      display: flex; align-items: center;
      color: var(--white); text-decoration: none;
      transition: color .3s ease;
    }
    nav a svg { width: 16px; height: 16px; display: block; }
    nav a:hover { color: var(--w60); }
    nav a::after { display: none; }

    .hero-text {
      display: flex; flex-direction: column;
      justify-content: flex-end; padding-bottom: 6px; pointer-events: none;
    }

    /* ── FOOTER ── */
    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto auto;
      align-items: end;
      pointer-events: auto;
    }

    .f-email, .f-phone {
      font-family: var(--font); font-size: 10px;
      font-weight: 400; letter-spacing: 0.06em;
      color: var(--white);
    }

    .f-email a, .f-phone a {
      color: inherit; text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: rgba(255,255,255,0.4);
      transition: color .3s, text-decoration-color .3s;
    }
    .f-email a:hover, .f-phone a:hover {
      color: var(--w60); text-decoration-color: var(--w60);
    }

    .f-phone { text-align: right; }

    .f-tagline {
      font-family: var(--font); font-size: 10px;
      font-weight: 400; letter-spacing: 0.12em;
      color: var(--white); text-align: center;
    }
    .f-tagline .f-line1::after { content: ' · '; }
    .f-tagline .f-line1,
    .f-tagline .f-line2 { display: inline; white-space: nowrap; }

    .f-copy {
      grid-column: 2;
      font-family: var(--font); font-size: 10px;
      font-weight: 400; letter-spacing: 0.12em;
      color: var(--white); opacity: 0.55;
      text-align: center; white-space: nowrap;
      margin-top: 4px;
    }

    /* ── CONTROLES ── */
    .controls {
      position: fixed; bottom: 68px; left: 50%;
      transform: translateX(-50%); z-index: 20;
      display: flex; align-items: center; gap: 16px; pointer-events: auto;
    }

    .ctrl {
      background: none; border: none; cursor: none;
      color: var(--w40); transition: color .25s ease;
      padding: 6px; display: flex; align-items: center;
    }
    .ctrl:hover { color: var(--white); }
    .ctrl svg { width: 18px; height: 18px; display: block; }

    .dots { display: flex; gap: 7px; align-items: center; }

    .dot {
      width: 4px; height: 4px; border-radius: 2px;
      background: var(--w25); border: none; cursor: none; padding: 0;
      transition: background .35s ease, width .35s ease;
    }
    .dot.active { background: var(--white); width: 20px; }

    /* ── CTA WHATSAPP ── */
    .cta-wa {
      position: fixed; bottom: 68px; right: var(--px); z-index: 20;
      display: flex; align-items: center; gap: 8px;
      color: var(--white); text-decoration: none;
      font-family: var(--font); font-size: 10px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      transition: color .3s ease; pointer-events: auto;
    }
    .cta-wa::after { content: '→'; font-size: 12px; transition: transform .3s ease; }
    .cta-wa:hover { color: var(--w60); }
    .cta-wa:hover::after { transform: translateX(4px); }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      :root { --px: 24px; --py: 28px; }
      html, body { cursor: auto; }
      .cursor { display: none; }
      nav { gap: 12px; }
      nav a svg { width: 14px; height: 14px; }
      footer {
        grid-template-columns: 1fr;
        grid-template-rows: unset;
        row-gap: 3px;
      }
      .f-email   { font-size: 9px; order: 1; }
      .f-tagline { font-size: 8px; text-align: left; order: 2; }
      .f-tagline .f-line1::after { content: ''; }
      .f-tagline .f-line1,
      .f-tagline .f-line2 { display: block; white-space: normal; }
      .f-phone   { display: block; text-align: left; font-size: 9px; order: 3; }
      .f-copy    { grid-column: unset; text-align: left; font-size: 8px; margin-top: 0; order: 4; white-space: normal; }
      .controls  { bottom: auto; top: 80%; gap: 12px; }
      .dot       { width: 6px; height: 6px; }
      .dot.active { width: 22px; }
      .ctrl      { cursor: auto; }
      .dot       { cursor: auto; }
      #grain     { display: none; }
      .cta-wa {
        bottom: auto;
        top: calc(80% - 40px);
        right: unset;
        left: 50%;
        transform: translateX(-50%);
        font-size: 9px;
      }
    }

    @media (max-width: 420px) {
      h1 { font-size: clamp(1.8rem, 9vw, 2.2rem); }
    }
  </style>

  <script>
    // IMÁGENES — agregar o quitar fotos aquí
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const desktopImages = shuffle([
      'mutual06.jpg','mutual10.jpg','mutual02v2.jpg',
      'mutual04.jpg','mutual09.jpg','mutual08.jpg',
      'mutual07.jpg','mutual05.jpg','mutual01.jpg',
      'mutual13.jpg','mutual12.jpg','mutual11.jpg'
    ]);

    const mobileImages = shuffle([
      'mutual03m.jpg','mutual04m.jpg','mutual02mv2.jpg',
      'mutual01m.jpg','mutual06mv2.jpg','mutual07mv2.jpg',
      'mutual08m.jpg','mutual09m.jpg','mutual05mv2.jpg'
    ]);

    // CONFIG
    const DURATION     = 5000;
    const FADE_MS      = 400;
    const PARALLAX_PX  = 18;
    const GLITCH_SHIFT = 10;

    let current       = 0;
    let isPaused      = false;
    let isTransition  = false;
    let timer         = null;
    let isMobile      = window.innerWidth <= 768;
    let isPointerFine = window.matchMedia('(pointer: fine)').matches;

    function getImages() { return isMobile ? mobileImages : desktopImages; }

    const slideshowEl   = document.getElementById('slideshow');
    const fadeOverlay   = document.getElementById('fadeOverlay');
    const glitchOverlay = document.getElementById('glitchOverlay');
    const dotsEl        = document.getElementById('dots');

    const maxSlides = Math.max(desktopImages.length, mobileImages.length);
    const slides = Array.from({ length: maxSlides }, () => {
      const el = document.createElement('div');
      el.className = 'slide';
      slideshowEl.appendChild(el);
      return el;
    });

    let dots = [];
    function buildDots() {
      dotsEl.innerHTML = '';
      dots = getImages().map((_, i) => {
        const btn = document.createElement('button');
        btn.className = 'dot' + (i === 0 ? ' active' : '');
        btn.setAttribute('aria-label', `Foto ${i + 1}`);
        btn.addEventListener('click', () => goTo(i));
        dotsEl.appendChild(btn);
        return btn;
      });
    }

    function rebuildSlides() {
      const imgs = getImages();
      slides.forEach((el, i) => {
        if (i < imgs.length) {
          el.style.backgroundImage = `url('${imgs[i]}')`;
          el.style.display = '';
        } else {
          el.classList.remove('active');
          el.style.opacity = '0';
          el.style.display = 'none';
        }
      });
      if (current >= imgs.length) current = 0;
      slides.forEach((el, i) => {
        if (el.style.display !== 'none') {
          el.classList.toggle('active', i === current);
        }
      });
    }

    [...desktopImages, ...mobileImages].forEach(src => {
      const img = new Image(); img.src = src;
    });

    // GRAIN
    (function initGrain() {
      const canvas = document.getElementById('grain');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const FPS = 8;
      let lastTime = 0;
      function resize() {
        canvas.width  = Math.ceil(window.innerWidth  / 2);
        canvas.height = Math.ceil(window.innerHeight / 2);
        canvas.style.width  = window.innerWidth  + 'px';
        canvas.style.height = window.innerHeight + 'px';
      }
      function drawGrain(ts) {
        requestAnimationFrame(drawGrain);
        if (ts - lastTime < 1000 / FPS) return;
        lastTime = ts;
        const img = ctx.createImageData(canvas.width, canvas.height);
        const d = img.data;
        for (let i = 0; i < d.length; i += 4) {
          const v = (Math.random() * 255) | 0;
          d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
        }
        ctx.putImageData(img, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(drawGrain);
    })();

    // GLITCH
    function triggerGlitch() {
      return new Promise(resolve => {
        const overlay     = glitchOverlay;
        const activeSlide = slides[current];
        let frame = 0;
        const FRAMES = 8;
        const originalTransform = activeSlide.style.transform || '';
        function glitchStep() {
          if (frame >= FRAMES) {
            overlay.style.opacity       = '0';
            overlay.style.background    = 'transparent';
            activeSlide.style.transform = originalTransform;
            activeSlide.style.filter    = 'none';
            resolve(); return;
          }
          const dx     = (Math.random() - 0.5) * GLITCH_SHIFT * 2;
          const rShift = (Math.random() - 0.5) * GLITCH_SHIFT;
          const bShift = (Math.random() - 0.5) * GLITCH_SHIFT;
          activeSlide.style.transform = `translateX(${dx}px)`;
          activeSlide.style.filter =
            `drop-shadow(${rShift}px 0 0 rgba(255,0,0,0.6))
             drop-shadow(${-bShift}px 0 0 rgba(0,150,255,0.6))`;
          if (frame === 0) {
            overlay.style.background = 'rgba(255,255,255,0.18)';
            overlay.style.opacity    = '1';
          } else if (frame === 2) {
            overlay.style.opacity = '0';
          }
          frame++;
          requestAnimationFrame(glitchStep);
        }
        requestAnimationFrame(glitchStep);
      });
    }

    // PARALLAX
    let mouseX = 0.5, mouseY = 0.5;
    let rafParallax = null;

    function applyParallax() {
      const slide = slides[current];
      if (!slide) return;
      const x = 50 + (mouseX - 0.5) * PARALLAX_PX * -1;
      const y = 50 + (mouseY - 0.5) * PARALLAX_PX * -1;
      slide.style.backgroundPosition = `${x.toFixed(2)}% ${y.toFixed(2)}%`;
    }

    if (isPointerFine && !isMobile) {
      document.addEventListener('mousemove', e => {
        mouseX = e.clientX / window.innerWidth;
        mouseY = e.clientY / window.innerHeight;
        cancelAnimationFrame(rafParallax);
        rafParallax = requestAnimationFrame(applyParallax);
      });
    }

    function resetParallax(slideEl) {
      slideEl.style.backgroundPosition = '50% 50%';
    }

    // TRANSICIÓN
    async function goTo(index) {
      if (isTransition) return;
      const imgs = getImages();
      const next = ((index % imgs.length) + imgs.length) % imgs.length;
      if (next === current) return;
      isTransition = true;
      clearTimeout(timer);
      if (isPointerFine && !isMobile) await triggerGlitch();
      fadeOverlay.classList.add('on');
      await wait(FADE_MS);
      resetParallax(slides[current]);
      slides[current].classList.remove('active');
      if (dots[current]) dots[current].classList.remove('active');
      current = next;
      slides[current].classList.add('active');
      if (dots[current]) dots[current].classList.add('active');
      if (isPointerFine && !isMobile) applyParallax();
      fadeOverlay.classList.remove('on');
      await wait(FADE_MS);
      isTransition = false;
      if (!isPaused) startTimer();
    }

    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
    const nextSlide = () => goTo(current + 1);
    const prevSlide = () => goTo(current - 1);

    function startTimer() {
      clearTimeout(timer);
      timer = setTimeout(nextSlide, DURATION);
    }

    // CONTROLES
    const iconPause = document.getElementById('iconPause');
    const iconPlay  = document.getElementById('iconPlay');

    function togglePause() {
      isPaused = !isPaused;
      iconPause.style.display = isPaused ? 'none'  : 'block';
      iconPlay.style.display  = isPaused ? 'block' : 'none';
      isPaused ? clearTimeout(timer) : startTimer();
    }

    document.getElementById('prevBtn').addEventListener('click', prevSlide);
    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('pauseBtn').addEventListener('click', togglePause);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft')  prevSlide();
      if (e.key === ' ') { e.preventDefault(); togglePause(); }
    });

    let touchX = 0, touchY = 0;
    document.addEventListener('touchstart', e => {
      touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 45) {
        dx < 0 ? nextSlide() : prevSlide();
      }
    }, { passive: true });

    // CURSOR
    const cursorEl = document.getElementById('cursor');
    if (isPointerFine) {
      document.addEventListener('mousemove', e => {
        cursorEl.style.left = e.clientX + 'px';
        cursorEl.style.top  = e.clientY + 'px';
      });
      document.querySelectorAll('a, button, .dot').forEach(el => {
        el.addEventListener('mouseenter', () => cursorEl.classList.add('big'));
        el.addEventListener('mouseleave', () => cursorEl.classList.remove('big'));
      });
    }

    window.addEventListener('resize', () => {
      const wasMobile = isMobile;
      isMobile = window.innerWidth <= 768;
      if (wasMobile !== isMobile) {
        current = 0;
        rebuildSlides();
        buildDots();
      }
    });

    rebuildSlides();
    buildDots();
    startTimer();
  </script>
</body>
</html>
